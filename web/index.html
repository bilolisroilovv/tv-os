<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TV OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="core/core.css">
<style>
  :root {
    --ease-focus: cubic-bezier(.2,1.2,.4,1); --dur-focus: 460ms;
    --ease-scroll: cubic-bezier(.2,.9,.3,1); --dur-scroll: 640ms;
    --ease-panel: cubic-bezier(.2,1.1,.35,1); --dur-panel: 480ms;
    --ease-cc: cubic-bezier(.2,1.15,.35,1); --dur-cc: 520ms;
    --ease-move: cubic-bezier(.2,1.2,.4,1); --dur-move: 440ms;
    --lg-a: rgba(255,255,255,.20); --lg-b: rgba(255,255,255,.06); --lg-c: rgba(255,255,255,.12);
    --label: #1d1d1f;
  }
  #stage { font-family: -apple-system, "SF Pro Display", "SF Pro Text", BlinkMacSystemFont, "Helvetica Neue", Inter, sans-serif; }
  #stage.dark { --label: #f5f5f7; }

  /* ---------- background: frosted glass over the photo (what you see in the grid) ---------- */
  #back, .layer { position: absolute; inset: 0; }
  .layer { background: center/cover no-repeat; opacity: 0; transition: opacity 1s ease; }
  .layer.on { opacity: 1; }
  #back .layer { transform: scale(1.08); } /* saturation and brightness are baked into the pre-blurred image (no CSS filter) */
  #frost { position: absolute; inset: 0; transition: background .6s ease;
           background: linear-gradient(118deg, rgba(255,255,255,.36) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 70%, rgba(255,255,255,.18) 100%), rgba(246,246,249,.44); }
  #stage.dark #frost { background: linear-gradient(118deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 40%), rgba(14,14,17,.5); }

  /* ---------- top shelf: the sharp photo ---------- */
  #shelf { position: absolute; inset: 0; overflow: hidden; will-change: opacity, transform;
           transition: opacity .55s ease, transform var(--dur-scroll) var(--ease-scroll); }
  #shelf .layer { transition: opacity 1.1s ease; }
  #shelfShade { position: absolute; inset: 0; pointer-events: none; background:
      radial-gradient(1100px 520px at 0% 0%, rgba(0,0,0,var(--tl, .32)) 0%, rgba(0,0,0,0) 70%),
      linear-gradient(180deg, rgba(0,0,0,.14) 0%, rgba(0,0,0,0) 20%),
      linear-gradient(0deg, rgba(0,0,0,.26) 0%, rgba(0,0,0,0) 32%); }
  #stage.grid #shelf { opacity: 0; transform: translateY(-40px) scale(1.03); }

  /* ---------- HUD: big clock + top-right controls ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; transition: transform var(--dur-scroll) var(--ease-scroll), opacity .4s ease; }
  #stage.grid #hud { transform: translateY(-140px); opacity: 0; }
  #clock { position: absolute; left: 96px; top: 64px; color: #fff; text-shadow: 0 2px 26px rgba(0,0,0,.26); transition: opacity .35s; display: flex; flex-direction: column; }
  #clock .greet { font-size: 22px; font-weight: 600; letter-spacing: 3.2px; text-transform: uppercase; opacity: .82; margin: 0 0 2px 5px; }
  #clock .time { font-size: 140px; font-weight: 500; letter-spacing: -4.5px; line-height: 1.02; font-variant-numeric: tabular-nums; }
  #clock .date { font-size: 34px; font-weight: 500; letter-spacing: -.2px; opacity: .92; margin: 2px 0 0 5px; }
  /* Lock-screen clock (iPhone / Mac): centred, the date above a large time. */
  #stage.clockc #clock { left: 0; right: 0; top: 46px; align-items: center; text-align: center; text-shadow: 0 2px 34px rgba(0,0,0,.22); }
  #stage.clockc #clock .greet { display: none; }
  #stage.clockc #clock .date { order: -1; font-size: 36px; font-weight: 600; letter-spacing: .2px; margin: 0; opacity: .94; }
  #stage.clockc #clock .time { font-size: 212px; font-weight: 600; letter-spacing: -7px; line-height: .96; margin-top: -4px; }
  #stage.clockc #shelfShade { background: radial-gradient(1100px 470px at 50% 12%, rgba(0,0,0,var(--tl, .32)) 0%, rgba(0,0,0,0) 72%),
      linear-gradient(180deg, rgba(0,0,0,.14) 0%, rgba(0,0,0,0) 20%), linear-gradient(0deg, rgba(0,0,0,.26) 0%, rgba(0,0,0,0) 32%); }
  #seg .sep { margin-left: 26px; }
  #place { position: absolute; right: 100px; bottom: 334px; font-size: 20px; font-weight: 500; color: rgba(255,255,255,.78); text-shadow: 0 1px 12px rgba(0,0,0,.5); transition: opacity .6s; }

  /* Liquid Glass */
  .lg { position: absolute; background: linear-gradient(165deg, var(--lg-a), var(--lg-b) 52%, var(--lg-c));
        backdrop-filter: blur(28px) saturate(1.9) brightness(1.06); -webkit-backdrop-filter: blur(28px) saturate(1.9) brightness(1.06);
        box-shadow: inset 0 1.5px 0 rgba(255,255,255,.48), inset 0 -1px 0 rgba(255,255,255,.12), 0 14px 40px rgba(0,0,0,.16); }
  .lg::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
        background: linear-gradient(135deg, rgba(255,255,255,.8) 0%, rgba(255,255,255,.1) 26%, rgba(255,255,255,0) 52%, rgba(255,255,255,.1) 76%, rgba(255,255,255,.5) 100%);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; transition: opacity .3s; }

  #bar { position: absolute; right: 88px; top: 70px; display: flex; gap: 18px; align-items: center; pointer-events: auto; }
  #barTime { font-size: 30px; font-weight: 600; color: #fff; text-shadow: 0 1px 12px rgba(0,0,0,.45); margin-right: 10px; opacity: 0; transform: translateX(14px);
             transition: opacity .3s ease, transform var(--dur-panel) var(--ease-panel); font-variant-numeric: tabular-nums; }
  #stage.ccopen #barTime { opacity: 1; transform: none; }
  .bb { position: relative; width: 72px; height: 72px; border-radius: 36px; display: grid; place-items: center;
        transition: transform var(--dur-focus) var(--ease-focus), background .22s, box-shadow .3s; }
  .bb svg { width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: stroke .2s; position: relative; }
  .bb .tip { position: absolute; top: 90px; left: 50%; transform: translate(-50%, -6px); white-space: nowrap; font-size: 21px; font-weight: 600; color: #fff;
             text-shadow: 0 1px 10px rgba(0,0,0,.55); opacity: 0; transition: opacity .22s, transform .4s var(--ease-scroll); }
  .bb:last-child .tip { left: auto; right: -6px; transform: translateY(-6px); }
  .bb.on, .bb.act { background: #fff; transform: scale(1.12); box-shadow: 0 14px 30px rgba(0,0,0,.28); }
  .bb.on::before, .bb.act::before { opacity: 0; }
  .bb.on svg, .bb.act svg { stroke: #111; }
  .bb.on .tip { opacity: 1; transform: translate(-50%, 0); }
  .bb:last-child.on .tip { transform: none; }
  #stage.ccopen .bb .tip { opacity: 0; }

  /* ---------- page: dock platter + icons ---------- */
  #page { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; will-change: transform; transition: transform var(--dur-scroll) var(--ease-scroll); }
  #platter { left: 40px; top: 766px; width: 1840px; height: 257px; border-radius: 58px; transition: background .5s ease, box-shadow .5s ease; }
  #stage.grid #platter { --lg-a: rgba(255,255,255,.62); --lg-b: rgba(255,255,255,.40); --lg-c: rgba(255,255,255,.50); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.9), 0 18px 40px rgba(0,0,0,.08); }
  #stage.dark.grid #platter { --lg-a: rgba(255,255,255,.12); --lg-b: rgba(255,255,255,.04); --lg-c: rgba(255,255,255,.08); }

  .app { position: absolute; left: 0; top: 0; width: 315px; height: 189px; perspective: 1000px; transition: transform var(--dur-move) var(--ease-move); }
  .app.focus { z-index: 5; }
  .wig { position: absolute; inset: 0; transform-style: preserve-3d; transition: opacity .35s ease; }
  .tilt { position: absolute; inset: 0; border-radius: 28px; transform-style: preserve-3d; will-change: transform;
          transition: transform var(--dur-focus) var(--ease-focus); box-shadow: 0 14px 24px -8px rgba(0,0,0,.34), 0 3px 8px rgba(0,0,0,.12); }
  /* The lifted shadow of the focused icon is drawn once and only fades in: no shadow repaint on every frame. */
  .tilt::before { content: ''; position: absolute; inset: 0; border-radius: 28px; pointer-events: none; opacity: 0; transition: opacity .3s ease;
                  box-shadow: 0 40px 50px -16px rgba(0,0,0,.55), 0 16px 32px rgba(0,0,0,.22); }
  .app.focus .tilt::before { opacity: 1; }
  .face { position: absolute; inset: 0; border-radius: 28px; background: #2a2a2e center/cover no-repeat; overflow: hidden; }
  .spec { position: absolute; inset: 0; border-radius: 28px; pointer-events: none; opacity: 0; mix-blend-mode: screen;
          background: radial-gradient(120% 90% at 26% -16%, rgba(255,255,255,.46) 0%, rgba(255,255,255,.1) 36%, rgba(255,255,255,0) 58%);
          transition: opacity .3s ease, transform var(--dur-focus) var(--ease-focus); }
  .rim { position: absolute; inset: 0; border-radius: 28px; pointer-events: none; padding: 2px; opacity: .45; transition: opacity .3s;
         background: linear-gradient(var(--rim, 140deg), rgba(255,255,255,.85) 0%, rgba(255,255,255,.08) 30%, rgba(255,255,255,0) 60%, rgba(255,255,255,.32) 100%);
         -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  #stage.grid:not(.dark) .tilt { box-shadow: 0 16px 26px -8px rgba(30,40,60,.32), 0 3px 8px rgba(30,40,60,.10); }
  #stage.grid:not(.dark) .tilt::before { box-shadow: 0 44px 54px -16px rgba(30,40,60,.48), 0 18px 34px rgba(30,40,60,.18); }
  .app.focus .spec { opacity: 1; }
  .app.focus .rim { opacity: 1; }
  .label { position: absolute; left: -60px; right: -60px; top: 222px; text-align: center; font-size: 28px; font-weight: 600; letter-spacing: -.1px; color: #fff;
           text-shadow: 0 1px 8px rgba(0,0,0,.38), 0 0 2px rgba(0,0,0,.22);
           opacity: 0; transform: translateY(-10px); transition: opacity .22s ease, transform .4s var(--ease-scroll), color .4s; white-space: nowrap; }
  #stage.grid .app.focus .label { opacity: 1; transform: none; }
  .app.moving .wig { animation: jiggle .24s ease-in-out infinite alternate; }
  @keyframes jiggle { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }
  #stage.menu .app:not(.focus) .wig { opacity: .42; }
  #page > * { transition: opacity .4s ease; }
  #stage.picking #page > *, #stage.picking #place { opacity: 0; }

  /* ---------- overlays ---------- */
  #shade { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .45s ease; background: rgba(0,0,0,.26); }
  #stage.modal #shade { opacity: 1; }
  #stage.ccopen #shade { opacity: 1; background: radial-gradient(1300px 900px at 100% 0%, rgba(0,0,0,.5) 0%, rgba(0,0,0,.18) 55%, rgba(0,0,0,0) 80%); }
  .pop { opacity: 0; transform: scale(.9) translateY(-14px); transform-origin: top right; pointer-events: none;
         transition: opacity .24s ease, transform var(--dur-panel) var(--ease-panel); }
  .pop.on { opacity: 1; transform: none; }
  .row { height: 72px; padding: 0 22px; border-radius: 24px; display: flex; align-items: center; gap: 18px; font-size: 26px; font-weight: 500; color: #fff;
         transition: background .18s, color .18s, transform .32s var(--ease-focus); }
  .row svg { width: 32px; height: 32px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .row .sub { margin-left: auto; font-size: 20px; opacity: .6; }
  .row.on { background: rgba(255,255,255,.94); color: #111; transform: scale(1.03); }
  .chk { margin-left: auto; opacity: 0; } .row.cur .chk { opacity: 1; } .row.cur .sub { display: none; }
  .pop h3 { margin: 10px 22px 10px; font-size: 20px; font-weight: 600; letter-spacing: .5px; color: rgba(255,255,255,.62); text-transform: uppercase; }
  #inputs { right: 178px; top: 164px; width: 460px; border-radius: 38px; padding: 14px; }
  #wifi { right: 88px; top: 164px; width: 460px; border-radius: 38px; padding: 14px 14px 16px; }
  #wifi .net { display: flex; align-items: center; gap: 20px; padding: 8px 22px 18px; color: #fff; }
  #wifi .net .ic { width: 62px; height: 62px; border-radius: 31px; background: #0a84ff; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(10,132,255,.4); }
  #wifi .net .ic svg { width: 32px; height: 32px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; }
  #wifi .net b { display: block; font-size: 30px; font-weight: 600; } #wifi .net span { font-size: 20px; opacity: .72; }

  /* Control Center — tvOS 26: separate glass controls that fly out of the Control Center button */
  #cc { position: absolute; right: 88px; top: 172px; width: 430px; height: 552px; pointer-events: none; }
  .tile.slider { width: 430px; height: 94px; border-radius: 47px; overflow: hidden; text-shadow: none; }
  .tile.slider .sfill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,.9); border-radius: 47px 0 0 47px; transition: width .32s cubic-bezier(.2,.9,.3,1); }
  .tile.slider .sic { position: absolute; left: 30px; top: 27px; width: 40px; height: 40px; transition: color .2s; }
  .tile.slider .sic svg { width: 40px; height: 40px; filter: none; }
  .tile.slider .slab { position: absolute; left: 86px; top: 0; line-height: 94px; font-size: 22px; font-weight: 600; transition: color .2s; }
  .tile.slider .sval { position: absolute; right: 30px; top: 0; line-height: 94px; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; transition: color .2s; }
  .tile.slider .dark { color: #1d1d1f; }
  #bright { position: absolute; inset: 0; background: #000; pointer-events: none; opacity: 0; transition: opacity .35s ease; z-index: 50; }
  .tile { position: absolute; border-radius: 36px; color: #fff; opacity: 0; transform: translate(var(--fx), var(--fy)) scale(.4);
          transition: transform var(--dur-cc) var(--ease-cc) var(--d, 0ms), opacity .22s ease var(--d, 0ms), background .22s ease, box-shadow .3s ease;
          text-shadow: 0 1px 3px rgba(0,0,0,.22); }
  #cc.on .tile { opacity: 1; transform: none; }
  #cc.on .tile.on { transform: scale(1.08); }
  .tile.on { --lg-a: rgba(255,255,255,.62); --lg-b: rgba(255,255,255,.38); --lg-c: rgba(255,255,255,.5);
             box-shadow: inset 0 2px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(255,255,255,.3), 0 22px 44px rgba(0,0,0,.32); }
  .tile svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 2px rgba(0,0,0,.2)); }
  .tile.sq { width: 206px; height: 206px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-size: 22px; font-weight: 600; }
  .tile.sq svg { width: 82px; height: 82px; stroke-width: 2.3; }
  .tile.pill { width: 206px; height: 94px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 47px; }
  .tile.pill .gl { width: 54px; height: 54px; border-radius: 27px; flex: none; display: grid; place-items: center; background: rgba(255,255,255,.16); }
  .tile.pill .gl svg { width: 30px; height: 30px; }
  .tile.pill .gl.blue { background: #0a84ff; } .tile.pill .gl.orange { background: #ff9f0a; }
  .tile.pill b { display: block; font-size: 20px; font-weight: 600; line-height: 1.15; white-space: nowrap; }
  .tile.pill span { display: block; font-size: 17px; opacity: .78; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 108px; }
  .tile.rnd { width: 94px; height: 94px; border-radius: 47px; display: grid; place-items: center; }
  .tile.rnd svg { width: 38px; height: 38px; }
  .tile .ttip { position: absolute; top: 108px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 20px; font-weight: 600; opacity: 0;
                transition: opacity .2s ease; text-shadow: 0 1px 10px rgba(0,0,0,.55); }
  .tile:last-child .ttip { left: auto; right: 0; transform: none; }
  .tile.on .ttip { opacity: 1; }

  /* wallpaper sheet */
  #picker { left: 40px; right: 40px; bottom: 34px; height: 500px; border-radius: 58px; padding-top: 44px; transform: translateY(560px);
            transition: transform var(--dur-panel) var(--ease-panel); }
  #picker.on { transform: none; }
  #picker h2 { margin: 0 0 4px 74px; font-size: 42px; font-weight: 700; letter-spacing: -.5px; color: #fff; }
  #picker .sub { margin-left: 76px; font-size: 21px; color: rgba(255,255,255,.7); }
  #thumbsWrap { position: absolute; left: 0; right: 0; top: 140px; height: 270px; overflow: hidden; }
  #thumbs { position: absolute; left: 74px; top: 22px; white-space: nowrap; transition: transform var(--dur-scroll) var(--ease-scroll); }
  .th { display: inline-block; vertical-align: top; width: 336px; height: 189px; margin-right: 34px; border-radius: 24px; background: #333 center/cover; position: relative;
        transition: transform var(--dur-focus) var(--ease-focus), box-shadow .3s; box-shadow: 0 8px 16px rgba(0,0,0,.25); }
  .th .n { position: absolute; left: -10px; right: -10px; top: 204px; text-align: center; font-size: 21px; font-weight: 500; color: rgba(255,255,255,.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .th.on { transform: scale(1.1); box-shadow: 0 32px 40px -12px rgba(0,0,0,.55); } .th.on .n { color: #fff; }
  .th .chk2 { position: absolute; right: 12px; top: 12px; width: 38px; height: 38px; border-radius: 19px; background: #fff; display: none; place-items: center; }
  .th.sel .chk2 { display: grid; }
  .th.add { background: rgba(255,255,255,.12); display: inline-grid; place-items: center; font-size: 76px; font-weight: 200; color: #fff; }
  #seg { position: absolute; left: 74px; bottom: 30px; display: flex; align-items: center; gap: 16px; font-size: 21px; color: rgba(255,255,255,.72); }
  #seg .opt { padding: 12px 26px; border-radius: 26px; background: rgba(255,255,255,.12); color: #fff; transition: transform .35s var(--ease-focus), background .2s, color .2s; }
  #seg .opt.cur { background: rgba(255,255,255,.3); }
  #seg .opt.on { background: #fff; color: #111; transform: scale(1.08); }

  /* context menu */
  #menu { width: 380px; border-radius: 34px; padding: 12px; transform-origin: left center; }
  #menu .row { height: 64px; font-size: 25px; }
  #menu .row.red { color: #ff6961; } #menu .row.red.on { color: #d70015; }

  /* toast */
  #toast { right: 88px; top: 170px; min-width: 430px; max-width: 640px; border-radius: 38px; padding: 22px 28px; display: flex; gap: 20px; align-items: center; color: #fff;
           transform: translateY(-340px); opacity: 0; transition: transform var(--dur-panel) var(--ease-panel), opacity .3s ease; }
  #toast.on { transform: none; opacity: 1; }
  #toast .ic { width: 62px; height: 62px; border-radius: 16px; background: rgba(255,255,255,.16) center/cover; flex: none; display: grid; place-items: center; }
  #toast .ic svg { width: 32px; height: 32px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #toast b { font-size: 24px; display: block; } #toast span { font-size: 20px; color: rgba(255,255,255,.75); }

  /* app launch */
  #launch { position: absolute; inset: 0; pointer-events: none; visibility: hidden; }
  #launch .bgc { position: absolute; inset: 0; }
  #launch .ban { position: absolute; left: 50%; top: 46%; width: 640px; height: 384px; margin: -192px 0 0 -320px; border-radius: 40px; background: center/cover; box-shadow: 0 40px 80px rgba(0,0,0,.45); }
  #launch .info { position: absolute; left: 0; right: 0; top: 76%; text-align: center; opacity: 0; transition: opacity .4s ease .35s; color: #fff; }
  #launch.open .info { opacity: 1; }
  #launch .info b { font-size: 40px; font-weight: 700; display: block; }
  #launch .info span { font-size: 22px; color: rgba(255,255,255,.62); display: block; margin-top: 12px; }
  .spin { width: 44px; height: 44px; margin: 0 auto 24px; border-radius: 50%; border: 4px solid rgba(255,255,255,.18); border-top-color: #fff; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* screensaver (Aerial-like) */
  #saver { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 1.2s ease; overflow: hidden; }
  #saver.on { opacity: 1; }
  #saver .layer { transition: opacity 2.4s ease; }
  #saver .layer.kb1 { animation: kb1 40s linear forwards; } #saver .layer.kb2 { animation: kb2 40s linear forwards; }
  @keyframes kb1 { from { transform: scale(1.16) translate(-2%, 1%); } to { transform: scale(1.02) translate(1.5%, -1%); } }
  @keyframes kb2 { from { transform: scale(1.03) translate(2%, -1%); } to { transform: scale(1.17) translate(-1.5%, 1.2%); } }
  #saver .vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.8s ease; }
  #saver .vid.on { opacity: 1; }
  #saver .sshade { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(1200px 560px at 50% 18%, rgba(0,0,0,.30) 0%, rgba(0,0,0,0) 72%), linear-gradient(0deg, rgba(0,0,0,.34) 0%, rgba(0,0,0,0) 28%); }
  #saver .sclock { position: absolute; left: 0; right: 0; top: 128px; text-align: center; color: #fff; text-shadow: 0 2px 32px rgba(0,0,0,.28);
                   opacity: 0; transform: translateY(-14px); transition: opacity 1.4s ease .5s, transform 1.4s cubic-bezier(.2,.9,.3,1) .5s; }
  #saver.on .sclock { opacity: 1; transform: none; }
  #saver .sdate { font-size: 40px; font-weight: 600; letter-spacing: .2px; opacity: .95; }
  #saver .stime { font-size: 236px; font-weight: 600; letter-spacing: -8px; line-height: .96; font-variant-numeric: tabular-nums; }
  #saver .cap { position: absolute; left: 96px; bottom: 80px; max-width: 1100px; color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.55); opacity: 0; transform: translateY(8px);
                transition: opacity 1.4s ease, transform 1.4s cubic-bezier(.2,.9,.3,1); }
  #saver .cap.on { opacity: 1; transform: none; }

<script>
(() => {

      const s = TV.spring(k, d);

  const ROW0 = 800, ROW1 = 1050, PITCH = 297, FS = 1.14;

  let order = (TV.store.get('tvos.order', null) || []).filter((id) => byId[id]);

  async function bannerFor(a) {

    const img = await loadImg(a.icon), W = 630, H = 378, cv = canvas(W, H), c = cv.getContext('2d'), [r, g, b] = await TV.color(a.icon);
    const gr = c.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, `rgb(${r * 0.62 | 0},${g * 0.62 | 0},${b * 0.62 | 0})`); gr.addColorStop(1, `rgb(${r * 0.32 | 0},${g * 0.32 | 0},${b * 0.32 | 0})`);

  const rowTop = (r) => (r === 0 ? ROW0 : ROW1 + (r - 1) * PITCH);
  const pos = (i) => ({ x: LEFT + (i % COLS) * (IW + GX), y: rowTop(Math.floor(i / COLS)) });
  const rows = () => Math.ceil(list.length / COLS);
  const pageY = (r) => (r === 0 ? 0 : -(rowTop(r) - 560));
  function relist() {

  }

  }

  // ---------- wallpaper ----------

  // Appearance: light, dark or automatic (dark from 19:00 to 7:00).
  const effLook = () => { const l = OS.pref('look'); if (l !== 'auto') return l; const h = new Date().getHours(); return h >= 19 || h < 7 ? 'dark' : 'light'; };

  // ---------- glyphs ----------
  const I = {
    hdmi: '<rect x="3" y="7" width="18" height="9" rx="2"/><path d="M7 16v2M17 16v2M7 10.5h10"/>',
    av: '<circle cx="6" cy="12" r="2.5"/><circle cx="12" cy="12" r="2.5"/><circle cx="18" cy="12" r="2.5"/>',

    saver: '<path d="M3 16.5l5-5.5 4 4 3-3 6 5.5"/><rect x="3" y="4" width="18" height="16" rx="2.5"/>',

    const s = $('#saver'); s.classList.toggle('black', !!black); s.classList.toggle('noclock', !OS.pref('saverClock')); s.classList.add('on');
    if (black) return;
    if (!AER.length || OS.pref('saverType') === 'photos') return startPhotos();
    const k = OS.pref('saverCats').join(); if (!aOrder.length || k !== catsKey) { aOrder = shuffled(); aIdx = 0; catsKey = k; }
    // While the first film buffers (a few seconds on a TV), the wallpaper drifts slowly instead of a black screen.
    Wallpapers.url(Wallpapers.current()).then((u) => { if (mode === 'saver' && !curVid && !photoMode) { const l = swap($('#saver'), u); l.classList.remove('kb2'); l.classList.add('kb1'); } });
    playAerial();
  }
  // Sleep: the screen goes black (from the screensaver too); any key wakes it.
  function sleepNow() {
    if (mode === 'saver') { $('#saver').classList.add('black'); vids.forEach((v) => v.pause()); clearTimeout(sTimer); clearTimeout(stall); return; }
    startSaver(true);
  }
  function stopSaver() {
    clearTimeout(sTimer); clearTimeout(stall); clearTimeout(capT);
    const s = $('#saver'); s.classList.remove('on'); $('#saver .cap').classList.remove('on');
    setTimeout(() => {
      if (mode === 'saver') return;
      vids.forEach((v) => { v.classList.remove('on'); v.pause(); v.removeAttribute('src'); v.load(); }); curVid = null;
      s.querySelectorAll('.layer').forEach((l) => { l.classList.remove('on'); l.style.backgroundImage = 'none'; l.dataset.src = ''; }); s.classList.remove('black');
    }, 1300);
    if (saverFrom === 'os' || saverFrom === 'launch') { mode = saverFrom; return; }
    mode = saverFrom === 'bar' ? 'bar' : 'home'; if (mode === 'home') focusApp(cur, 0, 0); else paintBar();
  }
  const saverIdle = TV.idle(OS.pref('saverAfter') * 60000, () => ['home', 'bar', 'os'].includes(mode) && !OS.top() && startSaver());
  OS.onPref('saverAfter', (m) => saverIdle.set(m * 60000));
  const sleepIdle = TV.idle(OS.pref('sleepAfter') * 60000, () => sleepNow());
  OS.onPref('sleepAfter', (m) => sleepIdle.set(m * 60000));

  function closeAll() {
    if (mode === 'cc') closeCC(); if (mode === 'picker') closePicker(); if (mode === 'menu') closeMenu(); if (mode === 'move') endMove();
    if (mode === 'inputs' || mode === 'wifi') { closePop(); mode = 'bar'; }
    if (mode === 'bar') { mode = 'home'; paintBar(); }
  }

  // ---------- remote ----------
  const D = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };
  let lastHome = 0;
  TV.on((a) => {
    if (mode === 'saver') { stopSaver(); return; }
    if (OS.top()) { OS.key(a); return; } // an alert, the keyboard or the app switcher has the remote
    if (a === 'home') { // twice quickly: the app switcher
      const now = performance.now(), dbl = now - lastHome < 450; lastHome = now;
      if (dbl) { openSwitcher(); return; }
      closeAll(); if (mode === 'os') { exitSettings(); return; } if (mode === 'launch') { closeApp(); return; }
      TV.sound.back(); if (row > 0) setRow(0); focusApp(0, 0, 0); return;
    }
    if (a === 'switcher') { openSwitcher(); return; }
    if (a === 'settings') { if (mode === 'os') return; closeAll(); leaveApp(); openSettings({}); return; }
    if (a === 'control') { if (mode === 'cc') { TV.sound.back(); closeCC(); } else { closeAll(); openCC(); } return; }
    if (a === 'screensaver') { startSaver(); return; }
    if (mode === 'os') {
      if (a === 'wallpapers') { leaveApp(); openPicker(); return; }
      OS.Settings.key(a); return;
    }
    if (mode === 'launch') { if (a === 'back') closeApp(); return; }
    if (a === 'wallpapers') { if (mode === 'picker') closePicker(); else { closeAll(); openPicker(); } return; }

    if (mode === 'inputs') {
      if (a === 'up' && inI > 0) { inI--; TV.sound.tick(); paintInputs(); }
      else if (a === 'down' && inI < INPUTS.length - 1) { inI++; TV.sound.tick(); paintInputs(); }
      else if (a === 'ok') {
        if (!INPUTS[inI]) { TV.sound.bump(); return; }
        const [g, n, , id] = INPUTS[inI]; inCur = inI; paintInputs(); TV.sound.select();
        setTimeout(() => {
          closePop(); mode = 'bar'; paintBar();
          if (!Platform.tv) toast('Источник', n + ' — на ТВ здесь включится вход', svg(g));
          else if (!Platform.openInput(id)) toast('Не удалось переключить', n, svg(g));
        }, 240);
      }
      else if (a === 'back') { TV.sound.back(); closePop(); mode = 'bar'; paintBar(); }
      else if (D[a]) TV.sound.bump();
      return;
    }
    if (mode === 'wifi') {
      if (a === 'ok') { TV.sound.select(); closePop(); mode = 'bar'; paintBar(); openSettings({ path: ['network', 'wifi'] }); }
      else if (a === 'back') { TV.sound.back(); closePop(); mode = 'bar'; paintBar(); }
      else if (D[a]) TV.sound.bump();
      return;
    }
    if (mode === 'cc') {
      if ((a === 'left' || a === 'right') && CC[ccI].cls === 'slider') { if (setBright(bright + (a === 'left' ? -10 : 10))) TV.sound.tick(); else bump(tiles[ccI], a === 'left' ? -1 : 1, 0); return; }
      if (D[a]) { const n = spatial(ccRects(), ccI, a); if (n >= 0) { ccI = n; TV.sound.tick(); paintCC(); } else bump(tiles[ccI], D[a][0], D[a][1]); }
      else if (a === 'ok') { TV.sound.select(); CC[ccI].act(); }
      else if (a === 'back') { TV.sound.back(); closeCC(); }
      return;
    }
    if (mode === 'picker') {
      if (a === 'left' || a === 'right') {
        const d = a === 'left' ? -1 : 1;
        if (pRow === 0) { const n = pI + d; if (n >= 0 && n < pList.length) { pI = n; TV.sound.tick(); previewWall(pList[pI].id); } else TV.sound.bump(); }
        else { const n = pI2 + d; if (n >= 0 && n < 4) { pI2 = n; TV.sound.tick(); } else TV.sound.bump(); }
        paintPicker();
      } else if (a === 'down' && pRow === 0) { pRow = 1; TV.sound.tick(); paintPicker(); }
      else if (a === 'up' && pRow === 1) { pRow = 0; TV.sound.tick(); paintPicker(); }
      else if (a === 'ok') {
        TV.sound.select();
        if (pRow === 1) {
          if (pI2 < 2) OS.setPref('look', pI2 ? 'dark' : 'light');
          else OS.setPref('clock', pI2 === 2 ? 'center' : 'left');
          paintPicker(); return;
        }
        const w = pList[pI];
        if (w.id === '__add') TV.pickFile().then((f) => f && Wallpapers.addCustom(f)).then((id) => { if (id) { buildPicker(); pI = pList.findIndex((x) => x.id === id); Wallpapers.set(id); } });
        else Wallpapers.set(w.id);
      } else if (a === 'back') { TV.sound.back(); closePicker(); }
      return;
    }
    if (mode === 'menu') {
      if (a === 'up' && mI > 0) { mI--; TV.sound.tick(); paintMenu(); }
      else if (a === 'down' && mI < mItems.length - 1) { mI++; TV.sound.tick(); paintMenu(); }
      else if (a === 'ok') { const it = mItems[mI]; closeMenu(); TV.sound.select(); it.act(); }
      else if (a === 'back') { TV.sound.back(); closeMenu(); }
      return;
    }
    if (mode === 'move') {
      if (D[a]) { const [dx, dy] = D[a]; const n = cur + dx + dy * COLS; if (dx && Math.floor(n / COLS) !== Math.floor(cur / COLS)) return bumpApp(dx, 0); moveTo(Math.min(n, list.length - 1)); }
      else if (a === 'ok' || a === 'back') endMove();
      return;
    }
    if (mode === 'bar') {
      if (a === 'left' || a === 'right') { const n = barI + (a === 'left' ? -1 : 1); if (n >= 0 && n < BAR.length) { barI = n; TV.sound.tick(); paintBar(); } else bump(BAR[barI], D[a][0], 0); }
      else if (a === 'down' || a === 'back') leaveBar();
      else if (a === 'up') bump(BAR[barI], 0, -1);
      else if (a === 'ok') { const k = BAR[barI].dataset.k; if (k === 'inputs') openInputs(); else if (k === 'wifi') openWifi(); else openCC(); }
      return;
    }
    // home
    if (D[a]) {
      const [dx, dy] = D[a];
      if (dx) { const n = cur + dx; if (n < 0 || n >= list.length || Math.floor(n / COLS) !== Math.floor(cur / COLS)) return bumpApp(dx, 0); TV.sound.tick(); return focusApp(n, dx, 0); }
      if (dy < 0 && row === 0) return enterBar();
      const r = row + dy; if (r < 0 || r >= rows()) return bumpApp(0, dy);
      TV.sound.tick(); return focusApp(Math.min(list.length - 1, r * COLS + (cur % COLS)), 0, dy);
    }
    if (a === 'ok') openApp();
    else if (a === 'hold') openMenu();
    else if (a === 'back') { if (row > 0) { TV.sound.back(); setRow(0); focusApp(lastTop, 0, -1); } else if (cur !== 0) { TV.sound.back(); focusApp(0, 0, 0); } }
  });

  // ---------- Android app events (android/: MainActivity) ----------
  let appsDirty = false;
  addEventListener('tvresume', () => {
    if (appsDirty && mode !== 'os') { Platform.reload(); return; }
    if (mode === 'launch') closeApp();
  });
  addEventListener('tvpause', () => { if (mode === 'saver') stopSaver(); });
  addEventListener('tvapps', () => { appsDirty = true; });

  window.Home = {
    art, appOrder: () => order.slice(), setHidden, moveFirst, resetOrder, toast,
    sleep: sleepNow, previewSaver: () => startSaver(), exitSettings, resume,
    launchFromSettings(id) { OS.Settings.hide({ instant: true }); zoomPage(false); mode = 'home'; openApp(byId[id]); },
    switcherClosed() { if (mode === 'home') focusApp(cur, 0, 0); },
  };
  applyWallpaper();
  applyBright();
  OS.glassPos();
  focusApp(0, 0, 0);
})();
</script>
</body>
</html>
