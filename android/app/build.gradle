plugins {
    id 'com.android.application'
}

// A native Android launcher (plain Views, no WebView, no libraries). web/ of the repository stays as the browser
// prototype; only the photos and Apple's Aerial catalogue that tools/aerials.py made on this computer are packed.
def tvAssets = layout.buildDirectory.dir('generated/tvassets')
def packTvAssets = tasks.register('packTvAssets', Sync) {
    from('../../web/assets/wallpapers') {
        include '*.jpg', 'thumb/*.jpg', 'preview/*.jpg', 'list.js'
        into 'wallpapers'
    }
    from('../../web/data') {
        include 'aerials.js'
        into 'data'
    }
    // Optional, made on this computer and never committed: banners and names that replace an app's own
    // (web/assets/icons/<package>.png, names.json)
    from('../../web/assets/icons') {
        include '*.png', 'names.json'
        into 'icons'
    }
    into tvAssets
}

android {
    namespace 'app.tvos.home'
    compileSdk 34

    defaultConfig {
        applicationId 'app.tvos.home'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    sourceSets {
        main {
            assets.srcDirs = [tvAssets]
        }
    }

    androidResources {
        // JPEG photos are stored as they are (already compressed).
        noCompress 'jpg'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Installed over ADB, never published: signed with this computer's debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild') { dependsOn packTvAssets }
